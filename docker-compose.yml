services:
  node1:
    build: .
    command: ["--id", "node1", "--port", "8000", "--peers", "node2=http://node2:8000,node3=http://node3:8000", "--data-dir", "/data"]
    ports: ["8001:8000"]
    volumes: ["node1-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"], interval: 2s, timeout: 1s, retries: 10}
  node2:
    build: .
    command: ["--id", "node2", "--port", "8000", "--peers", "node1=http://node1:8000,node3=http://node3:8000", "--data-dir", "/data"]
    ports: ["8002:8000"]
    volumes: ["node2-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"], interval: 2s, timeout: 1s, retries: 10}
  node3:
    build: .
    command: ["--id", "node3", "--port", "8000", "--peers", "node1=http://node1:8000,node2=http://node2:8000", "--data-dir", "/data"]
    ports: ["8003:8000"]
    volumes: ["node3-data:/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"], interval: 2s, timeout: 1s, retries: 10}
volumes:
  node1-data:
  node2-data:
  node3-data:
